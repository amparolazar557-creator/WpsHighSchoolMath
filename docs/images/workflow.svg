<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" role="img" aria-labelledby="title"><title id="title">从表达式到 WPS 文档的三步流程示意</title><rect width="1200" height="236" rx="18" fill="#eff4fc"/><rect x="28" y="26" width="354" height="184" rx="14" fill="#fff"/><text x="51" y="68" font-size="23" fill="#2563eb" font-weight="700">01</text><text x="51" y="111" font-size="26" fill="#172b4d" font-weight="700">输入表达式</text><text x="51" y="157" font-size="16" fill="#53637c" font-weight="400">x^2、sin(x)，或组合分段函数</text><text x="391" y="123" font-size="24" fill="#547ab3" font-weight="400">→</text><rect x="423" y="26" width="354" height="184" rx="14" fill="#fff"/><text x="446" y="68" font-size="23" fill="#2563eb" font-weight="700">02</text><text x="446" y="111" font-size="26" fill="#172b4d" font-weight="700">调整并预览</text><text x="446" y="157" font-size="16" fill="#53637c" font-weight="400">设置范围、参数、交点和切线</text><text x="786" y="123" font-size="24" fill="#547ab3" font-weight="400">→</text><rect x="818" y="26" width="354" height="184" rx="14" fill="#fff"/><text x="841" y="68" font-size="23" fill="#2563eb" font-weight="700">03</text><text x="841" y="111" font-size="26" fill="#172b4d" font-weight="700">插入到 WPS</text><text x="841" y="157" font-size="16" fill="#53637c" font-weight="400">文字文档或当前幻灯片</text></svg>
